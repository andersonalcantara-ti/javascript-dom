<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafo</title>
</head>
<body>
    <h1>Criando um parágrafo com JavaScript</h1>
    <script>
        let novoParagrafo = document.createElement('p');
        novoParagrafo.textContent = "Este é um parágrafo criado com JS";
        document.body.appendChild(novoParagrafo);
    </script>
</body>
</html>
