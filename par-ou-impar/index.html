<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou Impar</title> <!--Escrevi ímpar sem acento propositalmente-->
</head>
<body>
    <main>
        <section>
            <h1>Par ou Ímpar?</h1>
            <p>Digite um número para saber se é par ou ímpar.</p>
            <input type="number" id="number" placeholder="Digite um número" required>
            <button id="verificar">Verificar</button>
            <p>O número <span id="clone"> </span> é: <span id="parOuImpar"></span>!</p>

            <script>
                const btn = document.getElementById("verificar");
                btn.addEventListener("click", verificar);
                function verificar(){
                    const numeroDigitado = Number(document.getElementById("number").value);
                    const calculo = (numeroDigitado % 2);
                    if (calculo == 0){
                        document.getElementById("parOuImpar").textContent = "Par"
                    } else {
                        document.getElementById("parOuImpar").textContent = "Ímpar"
                    }
                    document.getElementById("clone").textContent = numeroDigitado;
                }
            </script>
        </section>
    </main>
    
</body>
</html>
