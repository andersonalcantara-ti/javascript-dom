<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 5 Pós Graduação</title>
</head>
<body>
    <form>
        <label for="mail">Gostaria que você me enviasse um e-mail</label>
        <input type="email" id="mail" name="mail">
        <button>Enviar</button>
    </form>
    <script>
        var email = document.getElementById("mail");
        email.addEventListener("input", function(event){
            if (email.validity.typeMismatch) {
                email.setCustomValidity("espero um e-mail");
            } else {email.setCustomValidity("");

            }
        });
        //Exemplo da apostila. Mas vou me desafiar a melhorar este exemplo, pois a entrada por exemplo a@a ele aceita como e-mail válido, e quero ajeitar isso).
    </script>
</body>
</html>
